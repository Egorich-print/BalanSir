[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "deny"
# cargo-deny 0.15+ flattened the old `[maintenance]` table into `[advisories]`
# and `unmaintained`/`unsound` are now scopes (all/workspace/transitive/none)
# rather than severities; the top-level `[maintenance]` key is rejected by
# current cargo-deny and would fail `cargo deny check` in CI.
unmaintained = "workspace"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"