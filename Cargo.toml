[workspace]
members = [
    "crates/balansir-common",
    "crates/balansir-control",
    "crates/balansir-daemon",
    "crates/balansir-executor",
    "crates/balansir-api",
    "crates/balansir-tests",
    "crates/balansir-b4",
    "crates/balansir-vpn",
    "crates/balansir-health",
    "crates/balansir-ota",
    "tools/balansir-image",
]
# The Tauri desktop shell is a standalone app (its own huge dependency tree);
# it is built separately with `cargo build` from webui/src-tauri.
exclude = ["webui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Egor Korostelev"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
smallvec = { version = "1", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
prometheus-client = "0.22"
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
rtnetlink = "0.14"
netlink-packet-route = "0.19"
netlink-packet-core = "0.7"
netlink-sys = "0.8"
libc = "0.2"
futures = "0.3"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
xz2 = "0.1"
flate2 = "1"
base64 = "0.22"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
