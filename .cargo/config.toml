[build]
# Default target for development (host)
# Uncomment below for cross-compilation to RISC-V
# target = "riscv64gc-unknown-linux-musl"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# Raspberry Pi / arm64: static musl build via zig as the linker.
# Requires `zig` + a `zig-cc` shim (`exec zig cc -target aarch64-linux-musl "$@"`).
# link-self-contained=no lets zig provide musl libc/CRT (avoids duplicate-crt).
[target.aarch64-unknown-linux-musl]
linker = "zig-cc"
rustflags = ["-C", "link-self-contained=no"]

[target.riscv64gc-unknown-linux-musl]
linker = "riscv64-linux-gnu-gcc"
rustflags = ["-C", "target-feature=+crt-static"]
