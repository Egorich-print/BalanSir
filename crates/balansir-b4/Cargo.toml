[package]
name = "balansir-b4"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust-native DPI-bypass engine (NFQUEUE packet interception and mutation)"

[dependencies]
balansir-common = { path = "../balansir-common" }
async-trait = "0.1"
tokio = { workspace = true, features = ["rt", "net", "macros", "io-util", "sync", "time"] }
serde = { workspace = true }
serde_json = "1"
toml = "0.8"
tracing.workspace = true
futures.workspace = true
thiserror.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys.workspace = true
netlink-packet-core.workspace = true
netlink-packet-utils = "0.5"
netlink-packet-netfilter = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
