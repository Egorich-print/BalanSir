[package]
name = "balansir-ota"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "BalanSir OTA subsystem: signed update management, A/B slot installation, boot selection, health checks, and automatic rollback"

[dependencies]
balansir-common = { path = "../balansir-common" }
async-trait = "0.1"
tokio = { workspace = true, features = ["rt", "net", "macros", "io-util", "sync", "time", "fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing.workspace = true
thiserror.workspace = true
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
xz2 = "0.1"
flate2 = "1"
base64 = "0.22"
tempfile = "3"
futures = "0.3"
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "macros", "io-util", "sync", "time", "fs", "process"] }
tempfile = "3"