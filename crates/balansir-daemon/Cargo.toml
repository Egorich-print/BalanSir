[package]
name = "balansir-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "balansir-cli"
path = "src/cli.rs"

[features]
# `dns` is on by default: the DNS forwarder is the P6 observation source that
# feeds the shared DnsRegistry (flow compiler + B4 observer). It only binds a
# socket when BALANSIR_DNS_CONFIG is set, so it is inert on hosts that do not
# run the forwarder.
default = ["wireguard", "xray", "hysteria", "b4", "dns"]
wireguard = []
xray = []
hysteria = []
b4 = []
amneziawg = []
dns = []

[dev-dependencies]
tempfile = "3"
proptest = "1"

[dependencies]
balansir-common = { path = "../balansir-common" }
balansir-control = { path = "../balansir-control" }
balansir-api = { path = "../balansir-api" }
balansir-b4 = { path = "../balansir-b4" }
balansir-vpn = { path = "../balansir-vpn" }
tokio = { workspace = true, features = ["rt", "net", "macros", "io-util", "fs", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json = "1"
async-trait = "0.1"
smallvec.workspace = true
toml = "0.8"
postcard.workspace = true
uuid.workspace = true
libc.workspace = true
thiserror.workspace = true
secrecy.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink.workspace = true
netlink-packet-route.workspace = true
futures.workspace = true
