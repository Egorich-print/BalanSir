<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="url(#grad1)" stroke-width="3"/>

  <!-- Network nodes -->
  <circle cx="100" cy="40" r="12" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="40" cy="90" r="10" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="160" cy="90" r="10" fill="url(#grad2)" opacity="0.8"/>
  <circle cx="60" cy="150" r="10" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="140" cy="150" r="10" fill="url(#grad1)" opacity="0.8"/>

  <!-- Center node (BalanSir) -->
  <circle cx="100" cy="100" r="25" fill="url(#grad1)" opacity="1"/>
  <text x="100" y="105" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="monospace">B</text>

  <!-- Connection lines -->
  <line x1="100" y1="52" x2="100" y2="75" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="90" x2="75" y2="95" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="90" x2="125" y2="95" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
  <line x1="60" y1="140" x2="85" y2="115" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="140" x2="115" y2="115" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>

  <!-- Labels -->
  <text x="100" y="30" text-anchor="middle" fill="#4ECDC4" font-size="8" font-family="monospace">WG</text>
  <text x="30" y="85" text-anchor="middle" fill="#45B7D1" font-size="8" font-family="monospace">VLESS</text>
  <text x="170" y="85" text-anchor="middle" fill="#45B7D1" font-size="8" font-family="monospace">HY2</text>
  <text x="50" y="165" text-anchor="middle" fill="#FF6B6B" font-size="8" font-family="monospace">B4</text>
  <text x="150" y="165" text-anchor="middle" fill="#FF6B6B" font-size="8" font-family="monospace">DNS</text>

  <!-- Outer ring decoration -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad2)" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/>
</svg>
