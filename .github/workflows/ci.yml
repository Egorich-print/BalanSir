name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, nightly]
      fail-fast: false
    # Nightly clippy is stricter than stable and currently flags pre-existing
    # lint candidates (e.g. clippy::double_must_use on async_trait traits). It
    # must not block the stable gate or the downstream `build` job (needs:
    # test). Keep it visible as an informational check; fix lint debt separately.
    continue-on-error: ${{ matrix.rust == 'nightly' }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy -- -D warnings

    - name: Run tests
      run: cargo test --verbose

  security:
    name: Security audit
    runs-on: ubuntu-latest
    # rustsec/audit-check posts a check-run annotation via the GitHub REST API;
    # the default read-only GITHUB_TOKEN on a public repo cannot do that and the
    # job (and therefore the whole workflow) fails with "Resource not accessible
    # by integration". Grant checks:write so the annotation step succeeds.
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # Vulnerability scanning (RustSec advisory database)
    - uses: rustsec/audit-check@v2.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # License / bans / maintenance policy checks
    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny

    - name: Cargo deny
      run: cargo deny check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools
      if: matrix.target != 'x86_64-unknown-linux-gnu'
      run: |
        case ${{ matrix.target }} in
          aarch64-unknown-linux-gnu)
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu
            ;;
          riscv64gc-unknown-linux-musl)
            sudo apt-get update
            sudo apt-get install -y gcc-riscv64-linux-gnu
            ;;
        esac

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: balansir-${{ matrix.target }}
        path: |
          target/${{ matrix.target }}/release/balansir-daemon
          target/${{ matrix.target }}/release/balansir-executor

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
