[package]
name = "balansir-console"
version = "0.1.0"
description = "BalanSir Network Operations Console (Tauri 2 desktop shell)"
edition = "2021"

# The desktop shell is intentionally thin: it wraps the Svelte SPA and talks
# to the BalanSir daemon over its REST API / SSE. All system logic remains in
# the Rust daemon and the privileged executor.
[lib]
name = "balansir_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
