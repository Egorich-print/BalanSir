# BalanSir runtime directory (ADR-030).
# Created before any service starts (systemd-tmpfiles-setup.service), owned
# root:balansir so the unprivileged daemon can bind daemon.sock and the
# privileged executor can bind executor.sock in the same directory.
d /run/balansir 0775 root balansir -

# TUN device for Tailscale (created at boot by systemd-tmpfiles).
d /dev/net - - - -
c /dev/net/tun 10 200 root root
